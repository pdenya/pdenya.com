baseURL: https://www.pdenya.com
languageCode: en-US
title: Paul Denya
googleAnalytics: G-ZS6EPHLQB0
theme: PaperMod
enableGitInfo: true
frontmatter:
  lastmod: ["lastmod", ":git", "date", "publishDate"]
taxonomies:
  category: category
  tag: tag
params:
  description: Solving problems
  defaultTheme: dark
  disableThemeToggle: true
  showShareButtons: false
  showReadingTime: true
  showToc: false
  showBreadCrumbs: false
  showCodeCopyButtons: true
  comments: false
  hideFooter: true
  showPostNavLinks: false
  assets:
    favicon: /favicon.png
    disableHLJS: true
markup:
  highlight:
    codeFences: true
    guessSyntax: true
    style: monokai
    noClasses: false
  goldmark:
    renderer:
      unsafe: true
outputs:
  home:
    - HTML
    - RSS
    - JSON
outputFormats:
  RSS:
    mediaType: application/rss+xml
    baseName: feed
menu:
  main:
    - name: Home
      url: /
    - name: Blog
      url: /blog
    - name: About
      url: /about
permalinks:
  posts: "/blog/:title"
module:
  hugoVersion:
    extended: true
  mounts:
    - source: node_modules/bootstrap/scss
      target: assets/bootstrap/scss
    - source: node_modules/bootstrap/dist/js
      target: assets/bootstrap/js
    - source: assets
      target: assets
    - source: static
      target: static
